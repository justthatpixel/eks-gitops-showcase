# EKS path: pulls DATABASE_URL/AUTH_SECRET from SSM Parameter Store via
# External Secrets Operator instead of the plain Secret in secret.yaml,
# writing into the SAME Secret name that one would have created — no
# change needed to backend-deployment.yaml's envFrom. No STORAGE_ACCESS_KEY/
# SECRET_KEY here: EKS reaches S3 via the IRSA role on this pod's own
# ServiceAccount instead of static credentials.
{{- if .Values.secretEnv.useExternalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "project.fullname" . }}-backend-secret
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secretEnv.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "project.fullname" . }}-backend-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.secretEnv.databaseUrlParamName }}
    - secretKey: AUTH_SECRET
      remoteRef:
        key: {{ .Values.secretEnv.authSecretParamName }}
{{- end }}
