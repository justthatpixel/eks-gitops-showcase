apiVersion: v1
kind: Service
metadata:
  name: {{ include "project.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: {{ include "project.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "project.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}