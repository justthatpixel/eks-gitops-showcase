{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  # Name defaults to the fullname-prefixed form, but EKS overrides this to
  # the exact "backend" the IRSA trust policy is scoped to
  # (terraform/modules/irsa: namespace_service_accounts = ["landing-builder:backend"]) —
  # IRSA trust conditions match the SA name literally, no wildcards.
  name: {{ .Values.serviceAccount.name | default (printf "%s-backend" (include "project.fullname" .)) }}
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
