{{- if not .Values.secretEnv.useExternalSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "project.fullname" . }}-backend-secret
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "backend.secretEnv.databaseUrl must be set (see values-kind.yaml for local)" .Values.secretEnv.databaseUrl | quote }}
  AUTH_SECRET: {{ required "backend.secretEnv.authSecret must be set" .Values.secretEnv.authSecret | quote }}
  {{- if .Values.secretEnv.storageAccessKey }}
  STORAGE_ACCESS_KEY: {{ .Values.secretEnv.storageAccessKey | quote }}
  STORAGE_SECRET_KEY: {{ .Values.secretEnv.storageSecretKey | quote }}
  {{- end }}
{{- end }}
